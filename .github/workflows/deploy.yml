name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Requirement: Test step
      - name: Run Tests / Code Validation
        run: |
          echo "Validating project files..."
          test -f index.html || (echo "index.html missing" && exit 1)
          test -f style.css || (echo "style.css missing" && exit 1)
          test -f script.js || (echo "script.js missing" && exit 1)
          echo "All sanity checks passed."

      # Requirement: Build / Package step
      - name: Build and Package
        run: |
          echo "Packaging static assets..."
          mkdir -p dist
          cp index.html style.css script.js dist/
          echo "Build artifact ready in dist/"

      # Requirement: Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Requirement: Deploy to Amazon S3
      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete